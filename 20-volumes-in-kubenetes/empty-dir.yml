apiVersion: v1
kind: Pod
metadata:
 name: empty-dir
spec:
 containers:
  - name: writer
    image: busybox
    command:
     - sh
     - -c
     - trap 'exit 1' TERM; while true;do sleep 1; done
    volumeMounts:
      - name: shared-data
        mountPath: /shared
  - name: reader
    image: busybox
    command:
     - sh
     - -c
     - sleep 3600
    volumeMounts:
      - name: shared-data
        mountPath: /shared
 volumes:
   - name: shared-data
     emptyDir: {}
