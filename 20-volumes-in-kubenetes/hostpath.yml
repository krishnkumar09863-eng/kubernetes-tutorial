apiVersion: v1
kind: Pod
metadata:
 name: hostpath-demo
spec:
 containers:
  - name: app
    image: ubuntu
    command:
     - sh
     - -c
     - sleep 3600
    volumeMounts:
     - name: host-storage
       mountPath: /data
 volumes: 
  - name: host-storage
    hostPath:
     path: /data/hostpath-demo
     type: Directory
