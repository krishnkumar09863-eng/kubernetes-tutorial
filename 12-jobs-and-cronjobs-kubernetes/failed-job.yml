apiVersion: batch/v1
kind: Job
metadata:
 name: failed-job
spec:
 backoffLimit: 3
 template:
  spec:
   restartPolicy: Never
   containers:
    - name: failing-container
      image: busybox:1.36
      command:
       - sh
       - -c
       - echo "Starting new failed task Job"
         echo "Something went wrong!!"
         exit 1
